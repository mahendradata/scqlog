# Web Log Visualizer
#
# Usage:
#   1. Place .log files in ./data/
#   2. Run: docker compose up --build
#   3. Open: http://localhost:8000/<basename>/<basename>.html

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories
      - ./data:/app/data
    environment:
      - DEBUG=false
